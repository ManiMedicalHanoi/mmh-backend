name: Khảo sát — quét câu trả lời mới
# App MMH Survey (MMH Wiki ▸ /mmh-library/survey/): 20 phút / lần từ 7h đến 21h (giờ Việt Nam), thứ Hai – thứ Bảy.
# Gọi survey ?action=rsTick ⇒ máy chủ đếm câu trả lời từng khảo sát; có câu trả lời mới ⇒ ghi RH_Notify (nút "Nhắc tôi" của Report Hub / CRM)
# và trả danh sách máy đã bật thông báo ⇒ gửi thông báo đẩy (tools/push/survey-push.mjs). Máy chủ Apps Script không tạo được trigger / không gửi được
# Web Push nên lịch + bước gửi chạy ở đây. Chạy tay: Actions ▸ Run workflow.
on:
  schedule:
    - cron: '*/20 0-14 * * 1-6'
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: survey-tick, cancel-in-progress: false }
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            backends.json
            backends/survey/MMH_SurveyAPI.gs
            tools/push
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save --no-audit --no-fund --prefix tools/push web-push@3.6.7
      - run: node tools/push/survey-push.mjs
