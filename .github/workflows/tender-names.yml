name: Theo dõi gói thầu — đối chiếu tên
# CHỈ ĐỌC: so tên chủ đầu tư (Báo Đấu Thầu, file tổng hàng hóa) với danh mục cơ sở y tế của Tender Map / Working Map và khách CRM Surgical / Dental / Eyeless VN (tools/msc/names.mjs).
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  names:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: { WT_BOT_KEY: '${{ secrets.WT_BOT_KEY }}' }
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: "backends.json\ntools/msc", sparse-checkout-cone-mode: false }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/msc/names.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: names-report, path: names-report.json, retention-days: 7, if-no-files-found: ignore }
