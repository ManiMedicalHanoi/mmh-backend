name: Theo dõi gói thầu — tải hồ sơ
# App "Theo dõi gói thầu" (Tender-Result/theo-doi/, backend tender-info ▸ MMH_Watch.gs): gói mới của chủ đầu tư đang theo dõi vào hàng đợi;
# workflow này mở muasamcong.mof.gov.vn bằng trình duyệt thật (như người dùng: đóng popup, gõ số TBMT / KHLCNT, mở gói, bấm tab, bấm tải)
# ⇒ gửi file về Drive (3 thư mục TBMT / Kết quả / KHLCNT + Sheet tổng hợp) qua backend. 5 phút / lần 7h–21h (giờ Việt Nam), thứ Hai – thứ Bảy. Hàng đợi trống ⇒ dừng sau vài giây (không cài trình duyệt).
# File đính kèm PDF cần Agent của muasamcong (chỉ chạy trên Windows) ⇒ ở đây chỉ ghi tên + mã file (app hiện nút mở trang gói).
# Cần secret WT_BOT_KEY (Admin: app Theo dõi gói thầu ▸ Cài đặt bot ▸ Sao chép khoá ⇒ GitHub mmh-backend ▸ Settings ▸ Secrets ▸ Actions).
# Chạy tay: Actions ▸ Theo dõi gói thầu — tải hồ sơ ▸ Run workflow.
# ⚠️ Lịch cron của GitHub gần như không tự chạy (18/11/2026: 0 lượt trong 3,5 giờ) ⇒ người đánh thức chính = Training Hub (trigger hwWarm 5 phút ▸ RH_WtKick.gs:
# hỏi tender-info wPing, còn gói chờ + không có lượt nào đang chạy ⇒ workflow_dispatch). Mỗi lượt tải tới 40 phút rồi TỰ GỌI LƯỢT KẾ khi hàng đợi còn gói.
on:
  schedule:
    - cron: '*/5 0-14 * * 1-6'
  workflow_dispatch:
permissions: { contents: read, actions: write }
concurrency: { group: tender-dl, cancel-in-progress: false }
jobs:
  dl:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    env:
      WT_BOT_KEY: ${{ secrets.WT_BOT_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            backends.json
            tools/msc
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Còn gói cần tải?
        id: peek
        run: |
          URL=$(node -e "console.log(require('./backends.json')['tender-info'].url)")
          echo "WT_URL=$URL" >> "$GITHUB_ENV"
          if [ -z "$WT_BOT_KEY" ]; then echo "Chưa có secret WT_BOT_KEY — bỏ qua."; echo "n=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          N=$(curl -sSL --max-time 90 -H 'Content-Type: application/json' -d "{\"action\":\"botPeek\",\"key\":\"$WT_BOT_KEY\",\"bot\":\"github-actions\"}" "$URL" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);console.log(j.ok?j.n:0); if(!j.ok) console.error(j.error||s.slice(0,200));}catch(e){console.log(0);console.error(s.slice(0,200));}})")
          echo "Gói cần tải: $N"; echo "n=$N" >> "$GITHUB_OUTPUT"
      - name: Cài trình duyệt
        if: steps.peek.outputs.n != '0'
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Tải hồ sơ từ muasamcong
        if: steps.peek.outputs.n != '0'
        env: { WT_OUT: /tmp/pw/wt-out, WT_PAR: '3', WT_N: '400', WT_MIN: '40' }
        run: cp tools/msc/bot.mjs /tmp/pw/ && cd /tmp/pw && node bot.mjs
      - name: Còn gói ⇒ gọi lượt kế
        if: always() && steps.peek.outputs.n != '0'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          N=$(curl -sSL --max-time 90 -H 'Content-Type: application/json' -d "{\"action\":\"botPeek\",\"key\":\"$WT_BOT_KEY\",\"bot\":\"github-actions\"}" "$WT_URL" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);console.log(j.ok?j.n:0);}catch(e){console.log(0);}})")
          echo "Còn $N gói"
          if [ "$N" != "0" ]; then gh workflow run tender-dl.yml --ref main -R "$GITHUB_REPOSITORY" && echo "Đã gọi lượt kế"; fi
      - uses: actions/upload-artifact@v4
        if: failure() && steps.peek.outputs.n != '0'
        with: { name: tender-dl-loi, path: /tmp/pw/wt-out/*.png, retention-days: 5, if-no-files-found: ignore }
