name: Tạm — xuất hàng hóa dao / chỉ (chỉ đọc)
on:
  push:
    branches: [ccr-39adae62-i3phb0]
    paths: ['.github/workflows/tmp-goods-export.yml', 'tools/msc/goods-export.mjs']
permissions: { contents: write }
jobs:
  x:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: { WT_BOT_KEY: '${{ secrets.WT_BOT_KEY }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/msc/goods-export.mjs
      - run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add export/goods-ophth.json && git commit -m "Xuất tạm hàng hóa dao / chỉ" && git push
