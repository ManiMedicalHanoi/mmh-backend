name: Tải PDF TBMT gốc (chạy 1 lần)
# Chạy thử bot (WT_DRY, không gọi máy chủ) để bấm "Tải TBMT" trên muasamcong ⇒ lưu PDF gốc vào nhánh làm việc.
on:
  push:
    branches: [ccr-d0ce2159-23u5p3]
    paths: [.github/workflows/tbmt-pdf.yml]
permissions: { contents: write }
jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Cài trình duyệt
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Tải TBMT
        env: { WT_OUT: /tmp/pw/wt-out, WT_DRY: 'IB2600604507', WT_MIN: '5' }
        run: cp tools/msc/bot.mjs /tmp/pw/ && cd /tmp/pw && node bot.mjs || true; ls -la /tmp/pw/wt-out || true
      - name: Lưu vào nhánh
        run: |
          mkdir -p tools/msc/probe/out/tbmt && cp /tmp/pw/wt-out/*.pdf tools/msc/probe/out/tbmt/ 2>/dev/null || true
          ls -la tools/msc/probe/out/tbmt
          git config user.name "probe-bot" && git config user.email "probe-bot@users.noreply.github.com"
          git add tools/msc/probe/out/tbmt && git commit -m "probe: PDF TBMT gốc [skip ci]" && git push || echo "không có gì"
