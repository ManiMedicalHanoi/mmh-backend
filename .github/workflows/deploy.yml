name: Deploy backend
# Tự chạy khi gộp thay đổi vào main trong thư mục backends/ → cập nhật đúng deployment cũ (URL /exec giữ nguyên).
# Chạy tay: Actions ▸ Deploy backend ▸ Run workflow ▸ chọn backend.
on:
  push:
    branches: [main]
    paths: ['backends/**']
  workflow_dispatch:
    inputs:
      backend:
        description: 'Backend cần deploy (key trong backends.json, hoặc all)'
        required: true
        default: all
concurrency: { group: gas-deploy, cancel-in-progress: false }
permissions: { contents: write }   # ghi lại backends.json khi tạo web app lần đầu (newWebapp)
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Deploy
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          DEPLOY_DESC: ${{ github.event_name == 'push' && github.event.head_commit.message || format('Deploy tay bởi {0}', github.actor) }}
          BEFORE: ${{ github.event.before }}
          INPUT_BACKEND: ${{ inputs.backend }}
        run: |
          DEPLOY_DESC="$(printf '%s' "$DEPLOY_DESC" | head -n1) (${GITHUB_SHA::7})"
          export DEPLOY_DESC
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            node tools/gas.mjs deploy-changed "$BEFORE" "$GITHUB_SHA"
          else
            node tools/gas.mjs deploy "$INPUT_BACKEND"
          fi
      - name: Lưu URL web app mới vào backends.json
        if: always()
        run: |
          if git diff --quiet -- backends.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backends.json
          git commit -m "Ghi Deployment ID + URL web app vừa tạo (deploy lần đầu)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push origin HEAD:main && break; sleep 5; done
