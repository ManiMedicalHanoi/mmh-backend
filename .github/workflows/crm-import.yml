name: Nhập bù task CRM (tạm)
# Một lần (04/11/2026): nhập bù lượt đi địa bàn + ảnh của Khang vào CRM Surgical. Chạy khi đẩy thay đổi tools/crm-import/** lên nhánh này.
on:
  push:
    branches: [ccr-998b4ddf-v1bgwo]
    paths: ['tools/crm-import/**', '.github/workflows/crm-import.yml']
permissions: { contents: read }
concurrency: { group: crm-import, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/crm-import/run.mjs
