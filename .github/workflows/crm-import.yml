name: Nhập bù task CRM (tạm)
# Một lần: thêm ảnh BV Quân Y 175 (07/09/2026) cho Khang — so trùng với ảnh đã có trước, trùng thì dừng không ghi.
on:
  push:
    branches: [ccr-998b4ddf-v1bgwo]
    paths: ['tools/crm-import/**', '.github/workflows/crm-import.yml']
permissions: { contents: read }
concurrency: { group: crm-import, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Đọc dòng 09/2026 + tải ảnh đã có
        run: MODE=check node tools/crm-import/run.mjs | grep -E "QUÂN Y 175|ảnh dòng|ping" || true
      - name: So ảnh (trùng ⇒ dừng)
        run: pip install -q pillow && python3 tools/crm-import/cmp.py tools/crm-import/khang-202609
      - name: Ghi
        run: MODE=apply node tools/crm-import/run.mjs
