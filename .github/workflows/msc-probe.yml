name: Thử truy cập muasamcong (tạm)
# Tạm: chạy thử bot (không ghi máy chủ). Xoá trước khi gộp.
on:
  push:
    branches: [claude/nice-brown-m3e3tu]
    paths: ['.github/workflows/msc-probe.yml', 'tools/msc/bot.mjs']
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Cài trình duyệt
        run: mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - name: Chạy thử bot
        env: { WT_DRY: "IB2500491794 PL2500276110", WT_PAR: "1" }
        run: cp tools/msc/bot.mjs /tmp/pw/ && cd /tmp/pw && node bot.mjs | grep -v "\[thử\] info"
