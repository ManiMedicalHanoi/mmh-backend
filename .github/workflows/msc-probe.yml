name: Thử truy cập muasamcong (tạm)
# Tạm thời: chạy thử công cụ Tải nhanh hồ sơ thầu (tools/msc/tai_nhanh.py) trên máy chủ GitHub (không có Agent ⇒ PDF chỉ kiểm tới bước bắt mã file). Xoá trước khi gộp.
on:
  push:
    branches: [claude/nice-brown-m3e3tu]
    paths: ['.github/workflows/msc-probe.yml', 'tools/msc/**']
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Cài Playwright
        run: pip install -q playwright==1.48.0 && python -m playwright install --with-deps chromium >/dev/null
      - name: Tải nhanh 2 gói
        run: cd tools/msc && time python tai_nhanh.py --cli IB2500491794 IB2500572120 --browser chromium
      - name: Đẩy file tải được lên nhánh (tạm, để xem)
        if: always()
        run: |
          [ -d "tools/msc/Ho so thau" ] || exit 0
          find "tools/msc/Ho so thau" -type f | head -50
          mkdir -p tmp-msc && cp -r "tools/msc/Ho so thau"/* tmp-msc/
          git config user.name "msc-probe" && git config user.email "msc-probe@users.noreply.github.com"
          git add tmp-msc && git commit -qm "Tạm: file tải thử (tai_nhanh.py)" && git push -q origin HEAD:claude/nice-brown-m3e3tu || true
