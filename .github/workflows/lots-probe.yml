name: Đọc phần lô TBMT (chạy 1 lần)
# Chỉ đọc trang TBMT muasamcong của vài gói ⇒ lưu bảng phần lô + bảo đảm dự thầu từng phần vào nhánh làm việc (tools/msc/probe/out).
on:
  push:
    branches: [ccr-d0ce2159-23u5p3]
    paths: [tools/msc/probe/lots_probe.mjs, .github/workflows/lots-probe.yml]
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Cài trình duyệt
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Đọc TBMT
        run: cp tools/msc/probe/lots_probe.mjs /tmp/pw/ && cd /tmp/pw && OUT=/tmp/pw/out node lots_probe.mjs
      - name: Lưu kết quả vào nhánh
        run: |
          mkdir -p tools/msc/probe/out && cp -r /tmp/pw/out/* tools/msc/probe/out/ || true
          git config user.name "probe-bot" && git config user.email "probe-bot@users.noreply.github.com"
          git add tools/msc/probe/out && git commit -m "probe: phần lô TBMT [skip ci]" && git push || echo "không có gì"
