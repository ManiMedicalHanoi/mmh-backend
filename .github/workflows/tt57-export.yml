name: TT57 — xuất dữ liệu rà soát
# Rà soát áp dụng TT 57/2025/TT-BYT (24/11/2026): đọc tracker Theo dõi gói thầu qua tender-info ▸ botTT57 (MMH_WatchTT57.gs, chỉ đọc)
# theo danh sách việc research/tt57/jobs.json ⇒ work/ ⇒ MÃ HOÁ (khoá công khai research/tt57/pub.pem; kho này công khai) ⇒ research/tt57/enc/
# rồi commit lên CHÍNH nhánh đang chạy (nhánh claude/…, không gộp vào main).
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['research/tt57/jobs.json', '.github/workflows/tt57-export.yml', 'tools/msc/tt57_export.mjs']
concurrency: { group: tt57-export, cancel-in-progress: false }
permissions: { contents: write, actions: write }
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      WT_BOT_KEY: ${{ secrets.WT_BOT_KEY }}
      TT57_MIN: '45'
      TT57_TEXT_MIN: '80'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Công cụ đọc chữ (pdftotext, OCR tiếng Việt, giải nén .rar, LibreOffice)
        if: ${{ hashFiles('research/tt57/jobs.json') != '' }}
        run: |
          grep -q '"blobs"' research/tt57/jobs.json || exit 0
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils ocrmypdf tesseract-ocr-vie p7zip-full libreoffice-writer-nogui >/dev/null || true
          sudo apt-get install -y -qq p7zip-rar >/dev/null 2>&1 || sudo apt-get install -y -qq unrar >/dev/null 2>&1 || true
      - run: node tools/msc/tt57_export.mjs
      - name: Đọc chữ file đã tải
        if: ${{ !cancelled() }}
        run: python3 tools/msc/tt57_text.py || true
      - name: Ghi kết quả lên nhánh
        if: ${{ !cancelled() && github.ref_name != 'main' }}
        run: |
          git config user.name "mmh-bot"; git config user.email "mmh-bot@users.noreply.github.com"
          if [ -d work ] && [ -n "$(ls -A work)" ]; then
            mkdir -p research/tt57/enc; TS=$(date -u +%Y%m%d-%H%M%S)
            tar -czf /tmp/w.tgz --exclude=work/raw work; openssl rand -out /tmp/k.bin 32
            openssl enc -aes-256-cbc -pbkdf2 -salt -in /tmp/w.tgz -out research/tt57/enc/$TS.tgz.enc -pass file:/tmp/k.bin
            openssl pkeyutl -encrypt -pubin -inkey research/tt57/pub.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/k.bin -out research/tt57/enc/$TS.key.enc
          fi
          git add -A research/tt57
          git commit -m "TT57: dữ liệu xuất $(date -u +%F' '%H:%M)" || exit 0
          for i in 1 2 3 4; do git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break; sleep $((i*5)); done
      - name: Còn việc ⇒ chạy tiếp
        if: ${{ !cancelled() && hashFiles('research/tt57/.more') != '' }}
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh workflow run tt57-export.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" || true
