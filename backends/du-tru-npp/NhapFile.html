<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  body { font-family: Arial, sans-serif; font-size: 13px; color: #1a1a1a; margin: 0; padding: 14px 18px; }
  h3 { margin: 0 0 6px; font-size: 15px; color: #003047; }
  h4 { margin: 12px 0 6px; font-size: 13px; color: #003047; }
  p { margin: 4px 0 10px; line-height: 1.45; }
  .muted { color: #666; }
  .ok { color: #2e7d32; } .err { color: #c62828; } .warn { color: #b45309; }
  table { width: 100%; border-collapse: collapse; margin-top: 6px; }
  th, td { border: 1px solid #d9d9d9; padding: 4px 8px; text-align: left; vertical-align: middle; }
  th { background: #cfe2f3; font-weight: bold; }
  td.n { text-align: right; }
  input[type=text] { width: 55%; padding: 5px 6px; border: 1px solid #bbb; border-radius: 3px; }
  button { font-size: 13px; padding: 6px 14px; border-radius: 4px; border: 1px solid #3a5caa; background: #3a5caa; color: #fff; cursor: pointer; }
  button.sec { background: #fff; color: #3a5caa; }
  button:disabled { opacity: .5; cursor: default; }
  ul { margin: 4px 0 8px 18px; padding: 0; } li { margin: 2px 0; }
  .box { border: 1px solid #d9d9d9; border-radius: 4px; padding: 10px 12px; margin-top: 12px; }
  .btns { margin-top: 10px; text-align: right; }
  .scroll { max-height: 220px; overflow: auto; }
  .lv-Cao { color: #c62828; font-weight: bold; } .lv-Theo { color: #b45309; font-weight: bold; }
  a { color: #1155cc; }
</style>
</head>
<body>
<h3>Nhập file Excel NPP gửi lại</h3>
<p id="info" class="muted">Đang đọc dữ liệu…</p>
<div class="box">
  <p style="margin-top:0"><b>Chọn file Excel trên máy</b> (có thể chọn nhiều file): <input type="file" id="files" accept=".xlsx" multiple onchange="pick_(this)"></p>
  <p style="margin-bottom:0">Hoặc dán đường dẫn file .xlsx trong Drive: <input type="text" id="link" placeholder="https://drive.google.com/file/d/…">
    <button class="sec" onclick="fromLink_()">Kiểm tra</button></p>
</div>
<div id="result"></div>
<div class="btns"><button class="sec" onclick="google.script.host.close()">Đóng</button></div>
<script>
  var SRC = {};
  var seq = 0;
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function n0(x) { return Number(x || 0).toLocaleString('vi-VN'); }
  google.script.run.withSuccessHandler(function (r) {
    if (!r.ok) { document.getElementById('info').innerHTML = '<span class="err">' + esc(r.error) + '</span>'; return; }
    document.getElementById('info').innerHTML = 'Tháng hiện tại: <b>' + esc(r.cm) + '</b> · đang nhận dự trù cố định tháng <b>' + esc(r.T) + '</b>. ' +
      'Khi nhập, các dòng dự trù cố định của NPP trong tháng dự trù của file ở sheet "' + esc(r.sheet) + '" được thay bằng số trong file. ' +
      'Các tháng khác và các NPP khác không thay đổi.';
  }).withFailureHandler(function (e) {
    document.getElementById('info').innerHTML = '<span class="err">' + esc(e.message || e) + '</span>';
  }).apiImportInfo();

  function card_(title) {
    var id = 'c' + (++seq);
    var d = document.createElement('div');
    d.className = 'box'; d.id = id;
    d.innerHTML = '<b>' + esc(title) + '</b><p class="muted">Đang đọc và kiểm tra file…</p>';
    document.getElementById('result').insertBefore(d, document.getElementById('result').firstChild);
    return id;
  }
  function pick_(inp) {
    Array.prototype.forEach.call(inp.files, function (f) {
      var id = card_(f.name);
      var rd = new FileReader();
      rd.onload = function () {
        SRC[id] = { name: f.name, b64: String(rd.result).split(',')[1] };
        check_(id);
      };
      rd.onerror = function () { document.getElementById(id).innerHTML = '<span class="err">Không đọc được file ' + esc(f.name) + '.</span>'; };
      rd.readAsDataURL(f);
    });
    inp.value = '';
  }
  function fromLink_() {
    var v = document.getElementById('link').value.trim();
    if (!v) return;
    var id = card_(v);
    SRC[id] = { ref: v };
    check_(id);
  }
  function check_(id) {
    google.script.run.withSuccessHandler(function (r) { show_(id, r); })
      .withFailureHandler(function (e) { show_(id, { fatal: e.message || String(e) }); }).apiPreviewImport(SRC[id]);
  }
  function list_(cls, title, arr, total) {
    if (!arr || !arr.length) return '';
    return '<h4 class="' + cls + '">' + title + ' (' + (total || arr.length) + ')</h4><ul>' +
      arr.map(function (x) { return '<li class="' + cls + '">' + esc(x) + '</li>'; }).join('') + '</ul>' +
      (total > arr.length ? '<p class="muted">Còn ' + (total - arr.length) + ' mục khác.</p>' : '');
  }
  function show_(id, r) {
    var el = document.getElementById(id);
    var src = SRC[id] || {};
    if (r.fatal) { el.innerHTML = '<b>' + esc(src.name || src.ref || '') + '</b><p class="err">' + esc(r.fatal) + '</p>'; return; }
    var h = '<b>' + esc(r.npp) + '</b> · dự trù cố định tháng <b>' + esc(r.T) + '</b> · ' + (r.url ? '<a href="' + esc(r.url) + '" target="_blank">' + esc(r.name) + '</a>' : esc(r.name));
    if (r.committed) h += '<p class="ok"><b>' + esc(r.note) + '</b></p>';
    else if (r.note) h += '<p class="err"><b>' + esc(r.note) + '</b></p>';
    h += '<table><thead><tr><th></th><th>Số mã</th><th>Tổng số lượng</th></tr></thead><tbody>' +
      '<tr><td>Trong file NPP</td><td class="n">' + r.newN + '</td><td class="n">' + n0(r.newSum) + '</td></tr>' +
      '<tr><td>Đang có trong file gốc (sẽ được thay)</td><td class="n">' + r.oldN + '</td><td class="n">' + n0(r.oldSum) + '</td></tr></tbody></table>';
    if (r.nCao || r.nHigh) h += '<p class="warn">Lưu ý: ' + r.nCao + ' mã có cảnh báo Cao vẫn dự trù; ' + r.nHigh + ' mã dự trù cao hơn đề xuất.</p>';
    h += list_('err', 'Lỗi – cần NPP sửa trước khi nhập', r.errors, r.nErrors);
    h += list_('warn', 'Lưu ý – vẫn nhập được', r.warnings, r.nWarnings);
    h += list_('muted', 'Thông tin', r.infos);
    if (r.lines && r.lines.length) {
      h += '<details><summary>Xem danh sách ' + r.nLines + ' mã sẽ nhập</summary><div class="scroll"><table><thead><tr><th>Mã hàng</th><th>Tên hàng</th>' +
        '<th>Số dự trù</th><th>Đề xuất</th><th>Cảnh báo</th></tr></thead><tbody>' +
        r.lines.map(function (x) {
          return '<tr><td>' + esc(x.code) + '</td><td>' + esc(x.name) + '</td><td class="n">' + n0(x.q) + '</td><td class="n">' +
            (x.dx == null ? '' : n0(x.dx)) + '</td><td class="lv-' + esc(String(x.lvl || '').split(' ')[0]) + '">' + esc(x.lvl) + '</td></tr>';
        }).join('') + '</tbody></table></div></details>';
    }
    if (!r.committed) h += '<div class="btns"><button id="b' + id + '" ' + (r.ok ? '' : 'disabled') + ' onclick="commit_(\'' + id + '\')">Nhập vào file gốc</button></div>';
    el.innerHTML = h;
  }
  function commit_(id) {
    var b = document.getElementById('b' + id);
    b.disabled = true; b.textContent = 'Đang nhập…';
    google.script.run.withSuccessHandler(function (r) { show_(id, r); })
      .withFailureHandler(function (e) { show_(id, { fatal: e.message || String(e) }); }).apiCommitImport(SRC[id]);
  }
</script>
</body>
</html>
