<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  body { font-family: Arial, sans-serif; font-size: 13px; color: #1a1a1a; margin: 0; padding: 14px 18px; }
  h3 { margin: 0 0 6px; font-size: 15px; color: #003047; }
  p { margin: 4px 0 10px; line-height: 1.45; }
  .muted { color: #666; }
  .ok { color: #2e7d32; } .err { color: #c62828; }
  .box { border: 1px solid #d9d9d9; border-radius: 4px; padding: 10px 12px; margin-top: 10px; }
  label.npp { display: inline-block; min-width: 150px; margin: 3px 12px 3px 0; }
  input[type=text] { padding: 5px 6px; border: 1px solid #bbb; border-radius: 3px; width: 110px; }
  button { font-size: 13px; padding: 6px 14px; border-radius: 4px; border: 1px solid #3a5caa; background: #3a5caa; color: #fff; cursor: pointer; }
  button.sec { background: #fff; color: #3a5caa; }
  button:disabled { opacity: .5; cursor: default; }
  table { width: 100%; border-collapse: collapse; margin-top: 6px; }
  th, td { border: 1px solid #d9d9d9; padding: 5px 8px; text-align: left; vertical-align: top; }
  th { background: #cfe2f3; }
  a { color: #1155cc; }
  .btns { margin-top: 12px; text-align: right; }
</style>
</head>
<body>
<h3>Xuất file Excel cho nhà phân phối</h3>
<p id="info" class="muted">Đang đọc dữ liệu…</p>
<div id="form" style="display:none">
  <div class="box">
    <b>Nhà phân phối</b> <a href="#" onclick="all_(true);return false">chọn tất cả</a> · <a href="#" onclick="all_(false);return false">bỏ chọn</a>
    <div id="npps" style="margin-top:6px"></div>
    <p style="margin-top:10px">Hạn gửi MMH (ngày/tháng/năm): <input type="text" id="han"></p>
    <p class="muted">Mỗi NPP một file Excel, lưu trong Drive (thư mục "MMH – File NPP" cạnh file gốc). Tải file về rồi gửi cho NPP.
      Số liệu lấy từ sheet SUM tại thời điểm xuất.</p>
  </div>
  <div class="btns"><button id="go" onclick="run_()">Xuất file Excel</button></div>
</div>
<div id="result"></div>
<div class="btns"><button class="sec" onclick="google.script.host.close()">Đóng</button></div>
<script>
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  google.script.run.withSuccessHandler(function (r) {
    if (!r.ok) { document.getElementById('info').innerHTML = '<span class="err">' + esc(r.error) + '</span>'; return; }
    document.getElementById('info').innerHTML = 'Tháng hiện tại: <b>' + esc(r.cm) + '</b>. File dùng để NPP nhập <b>dự trù cố định tháng ' + esc(r.T) + '</b>.';
    document.getElementById('npps').innerHTML = r.npps.map(function (n) {
      return '<label class="npp"><input type="checkbox" value="' + esc(n) + '" checked> ' + esc(n) + '</label>';
    }).join('');
    document.getElementById('han').value = r.han;
    document.getElementById('form').style.display = '';
  }).withFailureHandler(function (e) {
    document.getElementById('info').innerHTML = '<span class="err">' + esc(e.message || e) + '</span>';
  }).apiExportInfo();

  function all_(v) { Array.prototype.forEach.call(document.querySelectorAll('#npps input'), function (x) { x.checked = v; }); }

  function run_() {
    var list = Array.prototype.filter.call(document.querySelectorAll('#npps input'), function (x) { return x.checked; }).map(function (x) { return x.value; });
    if (!list.length) { alert('Vui lòng chọn ít nhất một nhà phân phối.'); return; }
    var han = document.getElementById('han').value;
    var go = document.getElementById('go');
    go.disabled = true;
    var res = document.getElementById('result');
    res.innerHTML = '<table><thead><tr><th>NPP</th><th>File</th><th>Kết quả</th></tr></thead><tbody id="rows"></tbody></table>';
    var i = 0;
    (function next() {
      if (i >= list.length) { go.disabled = false; go.textContent = 'Xuất lại'; return; }
      var npp = list[i++];
      var tr = document.createElement('tr');
      tr.innerHTML = '<td><b>' + esc(npp) + '</b></td><td colspan="2" class="muted">Đang tạo file…</td>';
      document.getElementById('rows').appendChild(tr);
      google.script.run.withSuccessHandler(function (r) {
        if (!r.ok) { tr.innerHTML = '<td><b>' + esc(npp) + '</b></td><td colspan="2" class="err">' + esc(r.error) + '</td>'; next(); return; }
        tr.innerHTML = '<td><b>' + esc(npp) + '</b></td><td>' + esc(r.name) + '<br><a href="' + esc(r.download) + '" target="_blank">Tải về</a> · ' +
          '<a href="' + esc(r.url) + '" target="_blank">Mở trong Drive</a> · <a href="' + esc(r.folderUrl) + '" target="_blank">Thư mục</a></td>' +
          '<td class="ok">Đã tạo. Danh sách ' + r.n + ' mã; ' + r.nDx + ' mã có dự trù đề xuất; ' + r.nCao + ' mã cảnh báo Cao.<br>' +
          '<span class="muted">Số liệu đến hết ' + esc(r.lastP) + ', dự trù tháng ' + esc(r.T) + '.</span></td>';
        next();
      }).withFailureHandler(function (e) {
        tr.innerHTML = '<td><b>' + esc(npp) + '</b></td><td colspan="2" class="err">' + esc(e.message || e) + '</td>';
        next();
      }).apiExportFile(npp, han);
    })();
  }
</script>
</body>
</html>
